<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0c0c1a; color:#f0f0f5; font-family:system-ui, sans-serif;
    padding:40px; user-select:none;
  }
  h2 { font-size:16px; margin:24px 0 12px; color:#818CF8; }
  .row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .item {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:80px; padding:12px 8px; border-radius:10px;
    background:rgba(255,255,255,.03); border:1px solid transparent;
    cursor:pointer; transition:all .2s;
  }
  .item:hover { border-color:#818CF8; background:rgba(129,140,248,.08); }
  .item .label { font-size:10px; color:rgba(255,255,255,.4); }
  .sidebar-bg { background:rgba(255,255,255,.05); padding:8px; border-radius:8px; }
</style>
</head>
<body>

<h1 style="font-size:20px;margin-bottom:8px;">Icon Style Preview</h1>
<p style="color:rgba(255,255,255,.4);font-size:12px;margin-bottom:24px">Click an item to select (console logs the style)</p>

<h2>Stroke Width</h2>
<div class="row">
  <div class="item" onclick="pick('stroke-width:1.5')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">1.5 极细</span>
  </div>
  <div class="item" onclick="pick('stroke-width:2 (current)')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">2 当前</span>
  </div>
  <div class="item" onclick="pick('stroke-width:2.5')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">2.5 适中</span>
  </div>
  <div class="item" onclick="pick('stroke-width:3')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">3 粗线</span>
  </div>
</div>

<h2>Fill Style</h2>
<div class="row">
  <div class="item" onclick="pick('fill:none (current outline)')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">描边 当前</span>
  </div>
  <div class="item" onclick="pick('fill:currentColor')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">纯填充</span>
  </div>
  <div class="item" onclick="pick('fill+stroke (duotone)')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">双色</span>
  </div>
  <div class="item" onclick="pick('fill+stroke bold')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <span class="label">粗双色</span>
  </div>
</div>

<h2>Sidebar (18px, on hover bg)</h2>
<div class="row">
  <div class="item sidebar-bg" onclick="pick('sidebar: stroke-2')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="label">当前</span>
  </div>
  <div class="item sidebar-bg" onclick="pick('sidebar: stroke-2.5')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="label">粗线</span>
  </div>
  <div class="item sidebar-bg" onclick="pick('sidebar: duotone')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="label">双色</span>
  </div>
  <div class="item sidebar-bg" onclick="pick('sidebar: filled')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="label">填充</span>
  </div>
</div>

<script>
  function pick(style) {
    console.log('Selected:', style);
    var prev = document.querySelector('.picked');
    if(prev) prev.classList.remove('picked');
    event.currentTarget.style.borderColor = '#64FFDA';
    event.currentTarget.style.background = 'rgba(100,255,218,.1)';
    event.currentTarget.classList.add('picked');
  }
</script>
</body>
</html>
