<!DOCTYPE html>
<html lang="zh-CN" data-theme="soft-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Origami</title>
<link rel="icon" href="../assets/logo.png" type="image/png">
<link rel="stylesheet" href="../css/themes.css">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: var(--font);
    background: var(--bg-deep);
    color: var(--text-primary);
    font-size:13px; -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  .app { display:flex; height:100%; }

  /* ══════ 侧边栏 ══════ */
  .sidebar {
    width:56px; display:flex; flex-direction:column; align-items:center;
    padding:16px 0; gap:6px; background: var(--bg-surface);
    border-right:1px solid var(--divider); flex-shrink:0; z-index:10;
  }
  .sb-logo {
    width:34px; height:34px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-bottom:12px;
    transition: transform .2s;
  }
  .sb-logo:hover { transform:scale(1.08); }
  .sb-item {
    width:38px; height:38px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-disabled);
    transition: all .18s; position:relative;
    background:transparent; border:none;
  }
  .sb-item svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; }
  .sb-item:hover { color:var(--text-secondary); background:var(--bg-hover); }
  .sb-item.active { color:var(--accent); background:var(--bg-hover); }
  .sb-spacer { flex:1; }
  .sb-badge {
    position:absolute; top:4px; right:4px; width:8px; height:8px;
    border-radius:50%; background:var(--error);
  }

  /* ══════ 主区域 ══════ */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ══════ 顶栏 ══════ */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; border-bottom:1px solid var(--divider); flex-shrink:0;
  }
  .topbar-title { font-size:15px; font-weight:700; }
  .topbar-user {
    display:flex; align-items:center; gap:8px; cursor:pointer;
    padding:4px 12px; border-radius:999px; border:1px solid var(--border-default);
    font-size:12px; color:var(--text-secondary);
    transition: all .2s;
  }
  .topbar-user:hover { border-color:var(--accent); color:var(--text-primary); }
  .topbar-av { width:26px; height:26px; border-radius:13px; background:var(--accent); }
  .topbar-status { width:7px; height:7px; border-radius:50%; }
  .topbar-status.on { background:var(--success); }
  .topbar-status.off { background:var(--text-disabled); }
  .topbar-logout {
    width:24px; height:24px; border-radius:6px; padding:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:transparent; border:none;
    color:var(--text-disabled); flex-shrink:0;
    transition: all .2s; margin-left:2px;
  }
  .topbar-logout:hover { color:var(--error); background:var(--bg-hover); }

  /* ══════ 内容区 ══════ */
  .content { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:20px 24px; gap:16px; max-width:900px; margin:0 auto; width:100%; }

  /* ══════ 输入框 ══════ */
  .input-wrap { flex-shrink:0; }
  .input-box {
    display:flex; align-items:center; height:48px; border-radius:10px;
    border:1px solid var(--border-default); background:var(--bg-surface);
    padding:0 16px; gap:10px; transition:border-color .2s;
  }
  .input-box:focus-within { border-color:var(--accent); }
  .input-box input {
    flex:1; border:none; background:none; color:var(--text-primary);
    font-size:13px; font-family:inherit; outline:none;
  }
  .input-box input::placeholder { color:var(--text-disabled); }
  .input-clear {
    background:none; border:none; color:var(--text-disabled);
    font-size:16px; cursor:pointer; display:none;
  }
  .input-clear.show { display:block; }
  .input-clear:hover { color:var(--text-secondary); }

  .platform-badge {
    display:none; align-items:center; gap:4px; padding:3px 10px;
    border-radius:999px; font-size:11px; font-weight:600;
    background:rgba(129,140,248,.12); color:var(--accent);
  }
  .platform-badge.show { display:flex; }

  /* ══════ 解析结果区 ══════ */
  .result { display:none; flex-direction:column; gap:12px; }
  .result.show { display:flex; }

  .author-card {
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-radius:10px;
    background:var(--bg-surface); border:1px solid var(--border-default);
  }
  .author-av {
    width:48px; height:48px; border-radius:24px;
    background:var(--accent); flex-shrink:0;
    overflow:hidden;
  }
  .author-av img { width:100%; height:100%; object-fit:cover; }
  .author-info { flex:1; min-width:0; }
  .author-name { font-size:14px; font-weight:700; }
  .author-meta { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .author-desc { font-size:11px; color:var(--text-disabled); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .author-acts { display:flex; gap:8px; flex-shrink:0; }

  .btn {
    padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; border:none; font-family:inherit; transition:all .2s;
  }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(129,140,248,.20); }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(129,140,248,.30); }
  .btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid var(--border-default); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--text-primary); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ══════ 预览区 ══════ */
  .preview-area { display:flex; flex-direction:column; gap:8px; }

  .preview-title {
    font-size:13px; font-weight:600; color:var(--text-secondary);
    display:flex; align-items:center; gap:8px;
  }
  .preview-title .count { font-size:11px; color:var(--text-disabled); }
  .preview-gallery-expand { animation: slideDown .25s ease; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

  /* ══════ 主页作品行式列表 ══════ */
  .post-list { display:flex; flex-direction:column; gap:6px; }
  .post-row {
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-radius:10px; background:var(--bg-surface);
    border:1px solid var(--border-default);
    transition:all .15s; cursor:pointer; flex-wrap:wrap;
  }
  .post-row:hover { border-color:var(--accent); }
  .post-row.deselected { opacity:.45; }
  .post-row .post-chk {
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--text-disabled); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; transition:all .15s;
  }
  .post-row .post-chk.on { background:var(--accent); border-color:var(--accent); }
  .post-thumb {
    width:72px; height:72px; border-radius:8px; overflow:hidden;
    flex-shrink:0; background:var(--bg-hover); position:relative;
  }
  .post-thumb img { width:100%; height:100%; object-fit:cover; }
  .post-thumb .post-type-tag {
    position:absolute; bottom:3px; right:3px; font-size:8px;
    padding:1px 5px; border-radius:3px; color:#fff; font-weight:600;
  }
  .post-info { flex:1; min-width:140px; }
  .post-info .post-title {
    font-size:13px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .post-info .post-meta { font-size:10px; color:var(--text-disabled); margin-top:3px; }
  .post-expand-btn {
    font-size:10px; padding:3px 10px; border-radius:99px; border:1px solid var(--border-default);
    background:transparent; color:var(--text-secondary); cursor:pointer;
    font-family:inherit; flex-shrink:0; transition:all .15s;
  }
  .post-expand-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* 图集展开区 */
  .gallery-strip {
    width:100%; overflow-x:auto; display:flex; gap:6px;
    padding:8px 0 4px; margin-top:2px;
  }
  .gallery-strip::-webkit-scrollbar { height:6px; }
  .gallery-strip::-webkit-scrollbar-thumb { background:var(--bg-hover); border-radius:3px; }
  .gallery-strip::-webkit-scrollbar-track { background:transparent; }
  .gallery-img {
    width:100px; height:100px; border-radius:6px; overflow:hidden;
    flex-shrink:0; position:relative; cursor:pointer;
    border:2px solid transparent; transition:all .15s;
    background:var(--bg-hover);
  }
  .gallery-img:hover { border-color:var(--accent); }
  .gallery-img.deselected { opacity:.4; border-color:transparent; }
  .gallery-img img { width:100%; height:100%; object-fit:cover; }
  .gallery-img .gallery-chk {
    position:absolute; top:4px; right:4px; width:18px; height:18px;
    border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; opacity:1;
  }
  .gallery-img.deselected .gallery-chk { opacity:0; }

  .preview-grid {
    display:grid; grid-template-columns:repeat(6, 1fr); gap:6px;
  }
  .preview-area {
    flex-shrink:1; overflow-y:auto; max-height:380px;
  }
  .preview-img {
    position:relative; aspect-ratio:1; border-radius:8px;
    background:var(--bg-surface); border:2px solid transparent;
    cursor:pointer; overflow:hidden; transition:all .15s;
  }
  .preview-img:hover { border-color:var(--accent); }
  .preview-img.deselected { opacity:.45; border-color:transparent; }
  .preview-img img { width:100%; height:100%; object-fit:cover; }
  .preview-img .check {
    position:absolute; top:6px; right:6px; width:20px; height:20px;
    border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; opacity:1; transition:opacity .15s;
  }
  .preview-img.deselected .check { opacity:0; }
  .live-badge {
    position:absolute; top:6px; left:6px; width:20px; height:20px;
    border-radius:50%; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }

  .preview-video {
    width:100%; max-width:320px; aspect-ratio:16/10; border-radius:10px;
    background:var(--bg-surface); border:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .preview-video img { width:100%; height:100%; object-fit:cover; }

  .preview-note {
    padding:14px 18px; border-radius:10px; background:var(--bg-surface);
    border:1px solid var(--border-default); font-size:12px;
    color:var(--text-secondary); line-height:1.6;
    max-height:160px; overflow-y:auto;
  }

  /* ══════ 日志/进度 ══════ */
  .log {
    padding:10px 14px; border-radius:8px; background:var(--bg-surface);
    font-family:monospace; font-size:11px; color:var(--text-disabled);
    max-height:100px; overflow-y:auto; display:none;
    flex-shrink:0; margin-top:auto;
  }
  .log.show { display:block; }

  .progress-bar {
    height:4px; border-radius:2px; background:var(--bg-hover);
    overflow:hidden; display:none; position:relative;
  }
  .progress-bar.show { display:block; }
  /* 不确定进度条——光条扫描 */
  .progress-sweep {
    position:absolute; top:0; left:0; width:40%; height:100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.4s ease-in-out infinite;
    border-radius:2px;
  }
  @keyframes sweep {
    0% { left:-40%; } 100% { left:100%; }
  }
  /* 按钮脉冲 */
  .btn-downloading { animation: btnPulse 1.5s ease-in-out infinite; }
  @keyframes btnPulse {
    0%,100% { opacity:1; } 50% { opacity:.7; }
  }
  /* 完成脉冲 */
  .btn-done {
    background:var(--success) !important; animation: donePop .5s ease;
  }
  @keyframes donePop {
    0% { transform:scale(1); } 50% { transform:scale(1.05); } 100% { transform:scale(1); }
  }
  /* 打开文件夹滑入 */
  .btn-slide-in {
    animation: slideIn .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateX(12px); }
    to { opacity:1; transform:translateX(0); }
  }

  /* 空态 */
  .empty-state {
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; color:var(--text-disabled);
  }
  .empty-icon { font-size:36px; opacity:.4; }
  .empty-text { font-size:13px; }
  .empty-hint { font-size:11px; color:var(--text-disabled); opacity:.6; }
</style>
</head>
<body>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sb-logo"><img src="../assets/logo.png" alt="O" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"></div>
    <button class="sb-item active" title="首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></button>
    <button class="sb-item" title="订阅"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button class="sb-item" title="主页备份"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
    <button class="sb-item" title="直播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg><span class="sb-badge"></span></button>
    <div class="sb-spacer"></div>
    <button class="sb-item" title="设置" onclick="openSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <!-- 顶栏 -->
    <div class="topbar">
      <span class="topbar-title">Origami</span>
      <div class="topbar-user" id="login-card">
        <div class="topbar-av" id="topbar-av"></div>
        <span id="login-text" onclick="openLogin()" style="cursor:pointer">登录</span>
        <div class="topbar-status off" id="topbar-status"></div>
        <button class="topbar-logout" id="logout-btn" title="退出登录" onclick="doLogout()" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- 内容 -->
    <div class="content" id="content">
      <!-- 输入框 -->
      <div class="input-wrap">
        <div class="input-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-disabled);flex-shrink:0"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input type="text" id="url-input"
                 placeholder="粘贴链接，自动识别平台和类型..."
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="input-clear" id="input-clear" onclick="clearInput()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          <span class="platform-badge" id="platform-badge"></span>
        </div>
      </div>

      <!-- 空态提示 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.4"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div>
        <div class="empty-text">粘贴抖音链接开始</div>
        <div class="empty-hint">支持视频、图集、文章、主页、直播间</div>
      </div>

      <!-- 解析结果 -->
      <div class="result" id="result">
        <!-- 作者卡片 -->
        <div class="author-card" id="author-card">
          <div class="author-av" id="author-av"></div>
          <div class="author-info">
            <div class="author-name" id="author-name">-</div>
            <div class="author-meta" id="author-meta">-</div>
            <div class="author-desc" id="author-desc">-</div>
          </div>
          <div class="author-acts">
            <button class="btn btn-ghost" id="btn-cancel" onclick="clearInput()">取消</button>
            <button class="btn btn-primary" id="btn-download" onclick="startDownload()">下载选中</button>
          </div>
        </div>

        <!-- 预览区 -->
        <div class="preview-area" id="preview-area"></div>
      </div>

      <!-- 进度 -->
      <div class="progress-bar" id="progress-bar">
        <div class="progress-sweep"></div>
      </div>

      <!-- 日志 -->
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  const input = document.getElementById('url-input');
  const clearBtn = document.getElementById('input-clear');
  const badge = document.getElementById('platform-badge');
  const result = document.getElementById('result');
  const empty = document.getElementById('empty-state');
  const previewArea = document.getElementById('preview-area');
  const log = document.getElementById('log');
  const progressBar = document.getElementById('progress-bar');
  let currentMedia = null;
  let selectedIndices = new Set();

  // ── 输入监听 ──
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
  });
  input.addEventListener('paste', () => setTimeout(resolveUrl, 200));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') resolveUrl();
  });

  function clearInput() {
    input.value = '';
    clearBtn.classList.remove('show');
    badge.classList.remove('show');
    result.classList.remove('show');
    empty.style.display = 'flex';
    previewArea.innerHTML = '';
    log.classList.remove('show');
    progressBar.classList.remove('show');
    currentMedia = null;
    currentPosts = [];
    postSelected = new Set();
    galleryImgSelected = {};
    selectedIndices = new Set();
    document.getElementById('author-card').style.display = 'none';
  }

  // ── 解析链接 ──
  async function resolveUrl() {
    const url = input.value.trim();
    if (!url) return;
    // 重置 UI
    resetResult();
    addLog('[解析] ' + truncate(url, 60));
    try {
      const r = await Origami.resolveUrl(url);
      badge.textContent = r.platform || '抖音';
      badge.classList.add('show');
      if (r.type === 'homepage') {
        await fetchHomepage(r.sec_uid);
      } else if (r.item_id) {
        await fetchMedia(r.item_id);
      } else {
        addLog('[!] 无法识别链接类型');
      }
    } catch (e) {
      addLog('[!] 解析失败: ' + e.message);
    }
  }

  function resetResult() {
    document.getElementById('btn-download').disabled = false;
    document.getElementById('btn-download').textContent = '下载选中';
    progressBar.classList.remove('show');
    var ob = document.getElementById('btn-open-folder');
    if (ob) ob.remove();
    previewArea.innerHTML = '';
    document.getElementById('author-card').style.display = 'none';
  }

  let currentPosts = [];  // for homepage posts
  let postSelected = new Set();

  async function fetchMedia(itemId) {
    addLog('[获取] 作品数据...');
    try {
      const m = await Origami.fetchMedia(itemId);
      currentMedia = m;
      currentPosts = [];
      showPreview(m);
      empty.style.display = 'none';

      addLog('[!] 获取失败: ' + e.message);
    }
  }

  var galleryImgSelected = {};  // {postIdx: Set of image indices}

      if (isGallery) {
        var imgs = p.images || [];
        h += '<div class=\"gallery-strip\" id=\"gallery-strip-' + i + '\" style=\"display:none\">';

    previewArea.innerHTML = h;

    // Initialize gallery image selections (all selected)
    for (var k = 0; k < posts.length; k++) {
      if ((posts[k].images || []).length > 0) {
        galleryImgSelected[k] = new Set(posts[k].images.map(function(_, j) { return j; }));

  window.toggleAllPosts = function() {
    var all = postSelected.size === currentPosts.length;
    if (all) { postSelected.clear(); }
    else { currentPosts.forEach(function(_, i) { postSelected.add(i); }); }
    for (var i = 0; i < currentPosts.length; i++) {
      var row = document.getElementById('post-row-' + i);
      var chk = document.getElementById('post-chk-' + i);
      if (row) row.classList.toggle('deselected', !postSelected.has(i));
      if (chk) { chk.classList.toggle('on', postSelected.has(i)); if (postSelected.has(i)) chk.textContent = 'V'; else chk.textContent = ''; }
    }
    updatePostBtn();
  };

  window.togglePost = function(idx) {
    var row = document.getElementById('post-row-' + idx);
    var chk = document.getElementById('post-chk-' + idx);
    if (postSelected.has(idx)) {
      postSelected.delete(idx);
      if (row) row.classList.add('deselected');
      if (chk) { chk.classList.remove('on'); chk.textContent = ''; }
      // Deselect all gallery images
      var strip = document.getElementById('gallery-strip-' + idx);
      if (strip) {
        var gimgs = strip.querySelectorAll('.gallery-img');
        gimgs.forEach(function(el){ el.classList.add('deselected'); });
      }
      if (galleryImgSelected[idx]) galleryImgSelected[idx].clear();
    } else {
      postSelected.add(idx);
      if (row) row.classList.remove('deselected');
      if (chk) { chk.classList.add('on'); chk.textContent = 'V'; }
      // Select all gallery images
      var strip2 = document.getElementById('gallery-strip-' + idx);
      if (strip2) {
        var gimgs2 = strip2.querySelectorAll('.gallery-img');
        gimgs2.forEach(function(el){ el.classList.remove('deselected'); });
      }
      var post = currentPosts[idx];
      if (post && (post.images || []).length > 0) {
        galleryImgSelected[idx] = new Set(post.images.map(function(_, j) { return j; }));
      }
    }
    updatePostBtn();
  };

  window.toggleGalleryImg = function(postIdx, imgIdx, evt) {
    (evt || window.event).stopPropagation();
    if (!postSelected.has(postIdx)) return; // master off -> can't toggle individual
    var el = document.querySelector('.gallery-img[data-pidx=\"' + postIdx + '\"][data-gidx=\"' + imgIdx + '\"]');
    if (!galleryImgSelected[postIdx]) galleryImgSelected[postIdx] = new Set();
    var sel = galleryImgSelected[postIdx];
    if (sel.has(imgIdx)) { sel.delete(imgIdx); if (el) el.classList.add('deselected'); }
    else { sel.add(imgIdx); if (el) el.classList.remove('deselected'); }
    // If all images deselected, auto-deselect the post
    if (sel.size === 0) {
      postSelected.delete(postIdx);
      var row = document.getElementById('post-row-' + postIdx);
      var chk = document.getElementById('post-chk-' + postIdx);
      if (row) row.classList.add('deselected');
      if (chk) { chk.classList.remove('on'); chk.textContent = ''; }
    } else if (!postSelected.has(postIdx)) {
      postSelected.add(postIdx);
      var row2 = document.getElementById('post-row-' + postIdx);
      var chk2 = document.getElementById('post-chk-' + postIdx);
      if (row2) row2.classList.remove('deselected');
      if (chk2) { chk2.classList.add('on'); chk2.textContent = 'V'; }
    }
    updatePostBtn();
  };

  window.expandGallery = function(idx, evt) {
    (evt || window.event).stopPropagation();
    var strip = document.getElementById('gallery-strip-' + idx);
    if (!strip) return;
    var btn = document.querySelector('#post-row-' + idx + ' .post-expand-btn');
    if (strip.style.display === 'none' || !strip.style.display) {
      strip.style.display = 'flex';
      if (btn) btn.textContent = '收起';
    } else {
      strip.style.display = 'none';
      if (btn) btn.textContent = '展开';
    }
  };

  function updatePostBtn() {
    var btn = document.getElementById('btn-dl-selected');
    if (!btn) return;
    // Count total selected items (posts + individual gallery images)
    var count = postSelected.size;
    for (var key in galleryImgSelected) {
      var pi = parseInt(key);
      if (postSelected.has(pi) && galleryImgSelected[key]) {
        count += galleryImgSelected[key].size - 1; // post already counted, add extra images
      }
    }
    btn.textContent = count === 0 ? '下载选中' : '下载选中 (' + count + ')';
    // Update toggle all button
    var tb = document.querySelector('button[onclick=\"toggleAllPosts()\"]');
    if (tb) tb.textContent = postSelected.size === currentPosts.length ? '全不选' : '全选';
  }

  async function startBatchDownload() {
    if (postSelected.size === 0) return;
    // Build download list: post IDs + optional image index filter
    var tasks = [];
    var selectedArr = Array.from(postSelected);
    for (var s = 0; s < selectedArr.length; s++) {
      var pi = selectedArr[s];
      var post = currentPosts[pi];
      var imgs = post.images || [];
      var selImgs = galleryImgSelected[pi];
      if (imgs.length > 0 && selImgs && selImgs.size < imgs.length) {
        // Some images deselected -> download specific images
        var imgIdxs = Array.from(selImgs).sort(function(a,b){return a-b;});
        tasks.push({item_id: post.item_id, images: imgIdxs.map(function(j){return j+1;}).join(',')});
      } else {
        tasks.push({item_id: post.item_id, images: ''});
      }
    }

    addLog('[下载] 批量下载 ' + tasks.length + ' 个作品...');
    var btn = document.getElementById('btn-dl-selected');
    if (btn) { btn.disabled = true; btn.textContent = '下载中...'; }
    progressBar.classList.add('show');
    var done = 0, total = tasks.length;
    for (var i = 0; i < tasks.length; i++) {
      try {
        addLog('[' + (i+1) + '/' + total + '] ' + tasks[i].item_id);
        await Origami.download(input.value.trim(), '', { item_id: tasks[i].item_id, images: tasks[i].images });
        done++;
        addLog('[' + done + '/' + total + '] OK');
      } catch(e) {
        addLog('[!] 失败: ' + e.message);
      }
    }
    progressBar.classList.remove('show');
    if (btn) { btn.disabled = false; btn.textContent = '下载选中 (' + postSelected.size + ')'; }
    addLog('[完成] ' + done + '/' + total + ' 成功');
  }

  window.previewLive = function(idx) {
    var vids = currentMedia?.live_videos || [];
    var videoUrl = vids[idx];
    if (!videoUrl) return;
    var el = document.querySelector('.preview-img[data-idx=\"' + idx + '\"]');
    if (!el) return;
    // Toggle off: if already playing, remove and restore
    var existingVid = el.querySelector('video');
    if (existingVid) {
      existingVid.pause();
      existingVid.remove();
      var _img = el.querySelector('img');
      if (_img) _img.style.display = '';
      return;
    }
    // Hide static elements
    var img = el.querySelector('img');
    var fb = el.querySelector('.fallback');
    var check = el.querySelector('.check');
    if (img) img.style.display = 'none';
    if (fb) fb.style.display = 'none';
    if (check) check.style.display = 'none';
    // Create video
    var video = document.createElement('video');
    video.src = '/api/proxy-media?url=' + encodeURIComponent(videoUrl);
    video.controls = true;
    video.autoplay = false;
    video.loop = true;
    video.muted = true;
    video.preload = 'auto';
    video.playsInline = true;
    video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;background:#000;border-radius:8px';
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    // Handle errors gracefully (log, don't remove immediately)
    var errCount = 0;
    video.onerror = function(e) {
      errCount++;
      if (errCount >= 3) {
        video.remove();
        if (img) img.style.display = '';
        if (check) check.style.display = '';
      }
    };
    el.appendChild(video);
  };

  window.toggleAll = function() {
    const urls = currentMedia?.media_urls || [];
    const allSelected = selectedIndices.size === urls.length;
    if (allSelected) {
      selectedIndices.clear();
      document.querySelectorAll('.preview-img').forEach(el => el.classList.add('deselected'));
      document.getElementById('btn-toggle-all').textContent = '全选';
    } else {
      urls.forEach((_,i) => selectedIndices.add(i));
      document.querySelectorAll('.preview-img').forEach(el => el.classList.remove('deselected'));
      document.getElementById('btn-toggle-all').textContent = '全不选';
    }
    updateBtn();
  };

  window.toggleImg = function(idx) {
    const el = document.querySelector(`.preview-img[data-idx="${idx}"]`);
    if (selectedIndices.has(idx)) {
      selectedIndices.delete(idx);
      el.classList.add('deselected');
    } else {
      selectedIndices.add(idx);
      el.classList.remove('deselected');
    }
    // 更新切换按钮状态
    const urls = currentMedia?.media_urls || [];
    const tb = document.getElementById('btn-toggle-all');
    if (tb) tb.textContent = selectedIndices.size === urls.length ? '全不选' : '全选';
    updateBtn();
  };

  function updateBtn() {
    const btn = document.getElementById('btn-download');
    const total = currentMedia?.media_urls?.length || 1;
    btn.textContent = selectedIndices.size === total ? '下载全部' : `下载 (${selectedIndices.size}/${total})`;
  }

  // ── 下载 ──
  function startDownload() {
    if (!currentMedia) return;
    const btn = document.getElementById('btn-download');
    btn.disabled = true;
    btn.classList.add('btn-downloading');
    btn.textContent = '下载中...';
    progressBar.classList.add('show');
    addLog(`[下载] 开始...`);

    // 脉动文字
    var dots = 0;
    var dotTimer = setInterval(() => { dots=(dots+1)%4; btn.textContent='下载中'+'.'.repeat(dots); }, 400);

    // 传原始链接 + 筛选序号给后端
    const url = input.value.trim();
    const mediaTotal = (currentMedia.media_urls || []).length;
    const isPartial = selectedIndices.size < mediaTotal && selectedIndices.size > 0;
    var saveDir = '';
    var opts = {};
    if (isPartial) {
      opts.images = Array.from(selectedIndices).sort((a,b)=>a-b).map(i=>i+1).join(',');
    }
    Origami.download(url, '', opts).then(r => {
      clearInterval(dotTimer);
      progressBar.classList.remove('show');
      btn.classList.remove('btn-downloading');
      btn.classList.add('btn-done');
      btn.disabled = false;
      btn.textContent = '完成';
      addLog(`[OK] 下载完成`);
      saveDir = r.save_dir || '';
      var acts = document.querySelector('.author-acts');
      if (!document.getElementById('btn-open-folder')) {
        var ob = document.createElement('button');
        ob.id = 'btn-open-folder'; ob.className = 'btn btn-ghost btn-slide-in';
        ob.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> 打开文件夹';
        ob.onclick = function(){ Origami.openFolder(saveDir); };
        acts.insertBefore(ob, btn);
      }
      setTimeout(() => btn.classList.remove('btn-done'), 2000);
    }).catch(e => {
      clearInterval(dotTimer);
      progressBar.classList.remove('show');
      btn.classList.remove('btn-downloading');
      btn.disabled = false;
      btn.textContent = '重试';
      addLog(`[!] 失败: ${e.message}`);
    });
  }

  // ── 日志 ──
  function addLog(msg) {
    log.classList.add('show');
    const line = document.createElement('div');
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 50) log.firstChild.remove();
  }

  function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function truncate(s,n) { return s && s.length > n ? s.slice(0,n)+'...' : s; }

  // ── 状态持久化 ──
  function saveState() {
    if (!currentMedia) return;
    try {
      sessionStorage.setItem('origami_url', input.value);
      sessionStorage.setItem('origami_media', JSON.stringify(currentMedia));
      sessionStorage.setItem('origami_selected', JSON.stringify(Array.from(selectedIndices)));
      sessionStorage.setItem('origami_log', log.innerHTML);
      sessionStorage.setItem('origami_badge', badge.textContent);
      sessionStorage.setItem('origami_badge_show', badge.classList.contains('show'));
    } catch(e) {}
  }
  function restoreState() {
    try {
      var saved = sessionStorage.getItem('origami_media');
      if (!saved) return false;
      currentMedia = JSON.parse(saved);
      input.value = sessionStorage.getItem('origami_url') || '';
      clearBtn.classList.add('show');
      var sel = sessionStorage.getItem('origami_selected');
      if (sel) selectedIndices = new Set(JSON.parse(sel));
      showPreview(currentMedia);
      empty.style.display = 'none';
      result.classList.add('show');
      badge.textContent = sessionStorage.getItem('origami_badge') || '';
      if (sessionStorage.getItem('origami_badge_show') === 'true') badge.classList.add('show');
      var logSaved = sessionStorage.getItem('origami_log');
      if (logSaved) { log.innerHTML = logSaved; log.classList.add('show'); }
      return true;
    } catch(e) { return false; }
  }

  window.addEventListener('beforeunload', saveState);

  // ── 导航 ──
  function openLogin() { saveState(); window.location.href = 'login.html?_=' + Date.now(); }
  function openSettings() { saveState(); window.location.href = 'settings.html'; }

  async function doLogout() {
    try { await Origami.logout(); } catch(e) {}
    // 重置 UI
    document.getElementById('login-text').textContent = '登录';
    document.getElementById('login-text').style.cursor = 'pointer';
    document.getElementById('login-text').onclick = openLogin;
    document.getElementById('login-text').style.cursor = 'pointer';
    document.getElementById('topbar-av').innerHTML = '';
    var st = document.getElementById('topbar-status');
    st.classList.remove('on'); st.classList.add('off');
    document.getElementById('logout-btn').style.display = 'none';
    addLog('[退出] 已清除登录');
  }

  // ── 启动 ──
  document.body.style.zoom = '131%';
  window.addEventListener('DOMContentLoaded', async () => {
    // 仅从 login/settings 页面返回时恢复状态，刷新或直接打开则清空
    var fromOurPage = document.referrer && (
      document.referrer.indexOf('login.html') !== -1 ||
      document.referrer.indexOf('settings.html') !== -1);
    if (fromOurPage) { restoreState(); }

    try {
      const cs = await Origami.cookieStatus();
      if (cs && cs.ok) {
        var st = document.getElementById('topbar-status');
        st.classList.add('on'); st.classList.remove('off');
        document.getElementById('logout-btn').style.display = 'flex';
        var lt = document.getElementById('login-text');
        lt.onclick = openLogin;  // 登录后也可点开
        // 加载头像
        try {
          const pf = await Origami.ownProfile();
          if (pf && pf.ok && pf.avatar) {
            document.getElementById('topbar-av').innerHTML = '<img src=\"'+pf.avatar+'\" style=\"width:100%;height:100%;border-radius:50%;object-fit:cover\">';
            lt.textContent = pf.nickname;
          } else {
            lt.textContent = '已登录';
          }
        } catch(e) { lt.textContent = '已登录'; }
      }
    } catch(e) {}
  });
</script>
</body>
</html>
