<!DOCTYPE html>
<html lang="zh-CN" data-theme="soft-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami</title>
<link rel="stylesheet" href="../css/themes.css">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: var(--font);
    background: var(--bg-deep);
    color: var(--text-primary);
    font-size:13px; -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  .app { display:flex; height:100%; }

  /* ══════ 侧边栏 ══════ */
  .sidebar {
    width:56px; display:flex; flex-direction:column; align-items:center;
    padding:16px 0; gap:6px; background: var(--bg-surface);
    border-right:1px solid var(--divider); flex-shrink:0; z-index:10;
  }
  .sb-logo {
    width:34px; height:34px; border-radius:8px;
    background: linear-gradient(135deg, var(--accent), #64FFDA);
    color:#0A0A14; font-weight:900; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-bottom:12px;
    transition: transform .2s;
  }
  .sb-logo:hover { transform:scale(1.08); }
  .sb-item {
    width:38px; height:38px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:17px; color:var(--text-disabled);
    transition: all .18s; position:relative;
    background:transparent; border:none;
  }
  .sb-item:hover { color:var(--text-secondary); background:var(--bg-hover); }
  .sb-item.active { color:var(--accent); background:var(--bg-hover); }
  .sb-spacer { flex:1; }
  .sb-badge {
    position:absolute; top:4px; right:4px; width:8px; height:8px;
    border-radius:50%; background:var(--error);
  }

  /* ══════ 主区域 ══════ */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ══════ 顶栏 ══════ */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; border-bottom:1px solid var(--divider); flex-shrink:0;
  }
  .topbar-title { font-size:15px; font-weight:700; }
  .topbar-user {
    display:flex; align-items:center; gap:8px; cursor:pointer;
    padding:4px 12px; border-radius:999px; border:1px solid var(--border-default);
    font-size:12px; color:var(--text-secondary);
    transition: all .2s;
  }
  .topbar-user:hover { border-color:var(--accent); color:var(--text-primary); }
  .topbar-av { width:26px; height:26px; border-radius:13px; background:var(--accent); }
  .topbar-status { width:7px; height:7px; border-radius:50%; }
  .topbar-status.on { background:var(--success); }
  .topbar-status.off { background:var(--text-disabled); }

  /* ══════ 内容区 ══════ */
  .content { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:20px 24px; gap:16px; max-width:900px; margin:0 auto; width:100%; }

  /* ══════ 输入框 ══════ */
  .input-wrap { flex-shrink:0; }
  .input-box {
    display:flex; align-items:center; height:48px; border-radius:10px;
    border:1px solid var(--border-default); background:var(--bg-surface);
    padding:0 16px; gap:10px; transition:border-color .2s;
  }
  .input-box:focus-within { border-color:var(--accent); }
  .input-box input {
    flex:1; border:none; background:none; color:var(--text-primary);
    font-size:13px; font-family:inherit; outline:none;
  }
  .input-box input::placeholder { color:var(--text-disabled); }
  .input-clear {
    background:none; border:none; color:var(--text-disabled);
    font-size:16px; cursor:pointer; display:none;
  }
  .input-clear.show { display:block; }
  .input-clear:hover { color:var(--text-secondary); }

  .platform-badge {
    display:none; align-items:center; gap:4px; padding:3px 10px;
    border-radius:999px; font-size:11px; font-weight:600;
    background:rgba(129,140,248,.12); color:var(--accent);
  }
  .platform-badge.show { display:flex; }

  /* ══════ 解析结果区 ══════ */
  .result { display:none; flex-direction:column; gap:12px; }
  .result.show { display:flex; }

  .author-card {
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-radius:10px;
    background:var(--bg-surface); border:1px solid var(--border-default);
  }
  .author-av {
    width:48px; height:48px; border-radius:24px;
    background:var(--accent); flex-shrink:0;
    overflow:hidden;
  }
  .author-av img { width:100%; height:100%; object-fit:cover; }
  .author-info { flex:1; min-width:0; }
  .author-name { font-size:14px; font-weight:700; }
  .author-meta { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .author-desc { font-size:11px; color:var(--text-disabled); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .author-acts { display:flex; gap:8px; flex-shrink:0; }

  .btn {
    padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; border:none; font-family:inherit; transition:all .2s;
  }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(129,140,248,.20); }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(129,140,248,.30); }
  .btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid var(--border-default); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--text-primary); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ══════ 预览区 ══════ */
  .preview-area { display:flex; flex-direction:column; gap:8px; }

  .preview-title {
    font-size:13px; font-weight:600; color:var(--text-secondary);
    display:flex; align-items:center; gap:8px;
  }
  .preview-title .count { font-size:11px; color:var(--text-disabled); }

  .preview-grid {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
  }
  .preview-img {
    position:relative; aspect-ratio:1; border-radius:8px;
    background:var(--bg-surface); border:2px solid transparent;
    cursor:pointer; overflow:hidden; transition:all .15s;
  }
  .preview-img:hover { border-color:var(--accent); }
  .preview-img.deselected { opacity:.45; border-color:transparent; }
  .preview-img img { width:100%; height:100%; object-fit:cover; }
  .preview-img .check {
    position:absolute; top:6px; right:6px; width:20px; height:20px;
    border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; opacity:1; transition:opacity .15s;
  }
  .preview-img.deselected .check { opacity:0; }

  .preview-video {
    width:100%; max-width:320px; aspect-ratio:16/10; border-radius:10px;
    background:var(--bg-surface); border:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .preview-video img { width:100%; height:100%; object-fit:cover; }

  .preview-note {
    padding:14px 18px; border-radius:10px; background:var(--bg-surface);
    border:1px solid var(--border-default); font-size:12px;
    color:var(--text-secondary); line-height:1.6;
    max-height:160px; overflow-y:auto;
  }

  /* ══════ 日志/进度 ══════ */
  .log {
    padding:10px 14px; border-radius:8px; background:var(--bg-surface);
    font-family:monospace; font-size:11px; color:var(--text-disabled);
    max-height:120px; overflow-y:auto; display:none;
  }
  .log.show { display:block; }

  .progress-bar {
    height:4px; border-radius:2px; background:var(--bg-hover);
    overflow:hidden; display:none;
  }
  .progress-bar.show { display:block; }
  .progress-fill { height:100%; background:var(--accent); transition:width .3s; width:0%; }

  /* 空态 */
  .empty-state {
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; color:var(--text-disabled);
  }
  .empty-icon { font-size:36px; opacity:.4; }
  .empty-text { font-size:13px; }
  .empty-hint { font-size:11px; color:var(--text-disabled); opacity:.6; }
</style>
</head>
<body>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sb-logo">O</div>
    <button class="sb-item active" title="首页">⌂</button>
    <button class="sb-item" title="订阅">★</button>
    <button class="sb-item" title="主页备份">☁</button>
    <button class="sb-item" title="直播"><span class="sb-badge"></span></button>
    <div class="sb-spacer"></div>
    <button class="sb-item" title="设置" onclick="openSettings()">⚙</button>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <!-- 顶栏 -->
    <div class="topbar">
      <span class="topbar-title">Origami</span>
      <div class="topbar-user" id="login-btn" onclick="openLogin()">
        <span id="login-text">登录</span>
        <div class="topbar-av"></div>
        <div class="topbar-status off"></div>
      </div>
    </div>

    <!-- 内容 -->
    <div class="content" id="content">
      <!-- 输入框 -->
      <div class="input-wrap">
        <div class="input-box">
          <span>🔗</span>
          <input type="text" id="url-input"
                 placeholder="粘贴链接，自动识别平台和类型..."
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="input-clear" id="input-clear" onclick="clearInput()">✕</button>
          <span class="platform-badge" id="platform-badge"></span>
        </div>
      </div>

      <!-- 空态提示 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">↓</div>
        <div class="empty-text">粘贴抖音链接开始</div>
        <div class="empty-hint">支持视频、图集、文章、主页、直播间</div>
      </div>

      <!-- 解析结果 -->
      <div class="result" id="result">
        <!-- 作者卡片 -->
        <div class="author-card" id="author-card">
          <div class="author-av" id="author-av"></div>
          <div class="author-info">
            <div class="author-name" id="author-name">-</div>
            <div class="author-meta" id="author-meta">-</div>
            <div class="author-desc" id="author-desc">-</div>
          </div>
          <div class="author-acts">
            <button class="btn btn-ghost" id="btn-cancel" onclick="clearInput()">取消</button>
            <button class="btn btn-primary" id="btn-download" onclick="startDownload()">下载选中</button>
          </div>
        </div>

        <!-- 预览区 -->
        <div class="preview-area" id="preview-area"></div>
      </div>

      <!-- 进度 -->
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- 日志 -->
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  const input = document.getElementById('url-input');
  const clearBtn = document.getElementById('input-clear');
  const badge = document.getElementById('platform-badge');
  const result = document.getElementById('result');
  const empty = document.getElementById('empty-state');
  const previewArea = document.getElementById('preview-area');
  const log = document.getElementById('log');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  let currentMedia = null;
  let selectedIndices = new Set();

  // ── 输入监听 ──
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
  });
  input.addEventListener('paste', () => setTimeout(resolveUrl, 200));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') resolveUrl();
  });

  function clearInput() {
    input.value = '';
    clearBtn.classList.remove('show');
    badge.classList.remove('show');
    result.classList.remove('show');
    empty.style.display = 'flex';
    previewArea.innerHTML = '';
    log.classList.remove('show');
    progressBar.classList.remove('show');
    currentMedia = null;
    selectedIndices = new Set();
    document.getElementById('author-card').style.display = 'none';
  }

  // ── 解析链接 ──
  async function resolveUrl() {
    const url = input.value.trim();
    if (!url) return;
    addLog('[解析] ' + truncate(url, 60));
    try {
      const r = await Origami.resolveUrl(url);
      badge.textContent = r.platform || '抖音';
      badge.classList.add('show');
      if (r.item_id) {
        await fetchMedia(r.item_id);
      } else {
        addLog('[!] 无法识别链接类型');
      }
    } catch (e) {
      addLog('[!] 解析失败: ' + e.message);
    }
  }

  async function fetchMedia(itemId) {
    addLog('[获取] 作品数据...');
    try {
      const m = await Origami.fetchMedia(itemId);
      currentMedia = m;
      showPreview(m);
      empty.style.display = 'none';
      result.classList.add('show');
      addLog('[OK] ' + (m.title || itemId));
    } catch (e) {
      addLog('[!] 获取失败: ' + e.message);
    }
  }

  // ── 显示预览 ──
  function showPreview(m) {
    const card = document.getElementById('author-card');
    card.style.display = 'flex';
    document.getElementById('author-name').textContent = m.author || '-';
    document.getElementById('author-meta').textContent = '';
    document.getElementById('author-desc').textContent = truncate(m.title, 50);
    // 头像
    var av = document.getElementById('author-av');
    av.innerHTML = m.author_avatar ? '<img src=\"'+m.author_avatar+'\" onerror=\"this.style.display=none\">' : '';

    previewArea.innerHTML = '';
    selectedIndices = new Set();

    if (m.item_type === 'video') {
      previewArea.innerHTML = `
        <div class="preview-title">📹 视频</div>
        <div class="preview-video">
          ${m.cover_url ? `<img src="${m.cover_url}" alt="cover">` : '🎬'}
        </div>`;
      selectedIndices.add(0);
    } else if (m.item_type === 'note') {
      previewArea.innerHTML = `
        <div class="preview-title">📝 文章</div>
        <div class="preview-note">${escapeHtml(m.text_content || m.title)}</div>`;
      selectedIndices.add(0);
    } else {
      // 图集
      const urls = m.media_urls || [];
      selectedIndices = new Set(urls.map((_,i) => i));
      previewArea.innerHTML = `
        <div class="preview-title">
          🖼 图集 <span class="count">${urls.length} 张 · 点击取消选择</span>
        </div>
        <div class="preview-grid" id="preview-grid">
          ${urls.map((u, i) => `
            <div class="preview-img" data-idx="${i}" onclick="toggleImg(${i})">
              <img src="${u}" loading="lazy" onerror="this.parentElement.querySelector('.fallback').style.display='block';this.style.display='none'">
              <span class="fallback" style="display:none;position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:18px;color:var(--text-disabled)">${i+1}</span>
              <span class="check">✓</span>
            </div>
          `).join('')}
        </div>`;
    }
  }

  window.toggleImg = function(idx) {
    const el = document.querySelector(`.preview-img[data-idx="${idx}"]`);
    if (selectedIndices.has(idx)) {
      selectedIndices.delete(idx);
      el.classList.add('deselected');
    } else {
      selectedIndices.add(idx);
      el.classList.remove('deselected');
    }
    updateBtn();
  };

  function updateBtn() {
    const btn = document.getElementById('btn-download');
    const total = currentMedia?.media_urls?.length || 1;
    btn.textContent = selectedIndices.size === total ? '下载全部' : `下载 (${selectedIndices.size}/${total})`;
  }

  // ── 下载 ──
  function startDownload() {
    if (!currentMedia) return;
    const btn = document.getElementById('btn-download');
    btn.disabled = true;
    btn.textContent = '下载中...';
    progressBar.classList.add('show');
    progressFill.style.width = '0%';

    let total = selectedIndices.size || 1;
    let done = 0;
    addLog(`[下载] 开始 (${total} 个)...`);

    const urls = currentMedia.media_urls || [];
    selectedIndices.forEach(idx => {
      const url = urls[idx];
      Origami.download(url, '').then(r => {
        done++;
        progressFill.style.width = (done/total*100) + '%';
        addLog(`[OK] ${done}/${total}`);
        if (done >= total) {
          btn.disabled = false;
          btn.textContent = '完成 ✓';
          progressBar.classList.remove('show');
          // 显示打开文件夹按钮
          var acts = document.querySelector('.author-acts');
          if (!document.getElementById('btn-open-folder')) {
            var ob = document.createElement('button');
            ob.id = 'btn-open-folder';
            ob.className = 'btn btn-ghost';
            ob.textContent = '📂 打开文件夹';
            ob.onclick = function(){ Origami.openFolder(''); };
            acts.insertBefore(ob, btn);
          }
        }
      }).catch(e => {
        done++;
        addLog(`[!] 失败: ${e.message}`);
      });
    });
  }

  // ── 日志 ──
  function addLog(msg) {
    log.classList.add('show');
    const line = document.createElement('div');
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 50) log.firstChild.remove();
  }

  function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function truncate(s,n) { return s && s.length > n ? s.slice(0,n)+'...' : s; }

  // ── 导航 ──
  function openLogin() { window.location.href = 'login.html'; }
  function openSettings() { window.location.href = 'settings.html'; }

  // ── 启动 ──
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const cs = await Origami.cookieStatus();
      if (cs && cs.ok) {
        document.getElementById('login-text').textContent = '已登录';
        document.querySelector('.topbar-status').classList.add('on');
        document.querySelector('.topbar-status').classList.remove('off');
      }
    } catch(e) {}
  });
</script>
</body>
</html>
